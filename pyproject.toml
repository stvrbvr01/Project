[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "openclaw-computer-use"
version = "0.1.0"
description = "Token-efficient computer use skill for openclaw — lets Claude see the screen, move the mouse, and type like a human."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.43.0",
    "mss>=9.0.0",
    "Pillow>=10.0.0",
    "pyautogui>=0.9.54",
]

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest"]

[project.scripts]
openclaw-cu = "openclaw_computer_use.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
